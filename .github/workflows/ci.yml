name: Run Tests and Coverage

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov coverage
    
    - name: Run tests with coverage
      run: |
        coverage run -m pytest tests/ -v
        coverage html
        coverage xml
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: htmlcov/
        
    - name: Generate evidencias.json
      run: |
        python -c "
        import json
        import xml.etree.ElementTree as ET
        
        try:
            tree = ET.parse('coverage.xml')
            root = tree.getroot()
            line_rate = float(root.get('line-rate', 0)) * 100
            branch_rate = float(root.get('branch-rate', 0)) * 100
        except:
            line_rate = 0
            branch_rate = 0
            
        data = {
            'cobertura_lineas': round(line_rate, 2),
            'cobertura_ramas': round(branch_rate, 2),
            'tests_ejecutados': 'pending',
            'estado_ci': 'success' if line_rate >= 90 else 'warning'
        }
        
        with open('evidencias.json', 'w') as f:
            json.dump(data, f, indent=2)
        "
    
    - name: Upload evidencias
      uses: actions/upload-artifact@v3
      with:
        name: metricas
        path: evidencias.json